seed: 42

task:
  name: chnsenticorp
  num_labels: 2
  text_field: text
  label_field: label

model:
  pretrained_name: hfl/chinese-macbert-base
  max_length: 256

train:
  output_dir: outputs/bert_chnsenticorp
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.06
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true

data:
  # 占位路径：你需要按 docs/DATASETS.md 准备好 data/chnsenticorp 目录。
  data_dir: data/chnsenticorp
  train_file: train.jsonl
  valid_file: valid.jsonl
  test_file: test.jsonl
