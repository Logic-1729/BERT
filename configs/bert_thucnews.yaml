seed: 42

task:
  name: thucnews
  num_labels: 10
  text_field: text
  label_field: label

model:
  pretrained_name: bert-base-chinese
  max_length: 256

train:
  output_dir: outputs/bert_thucnews
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.06
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true

data:
  # 说明：本仓库不分发数据。这里留作占位路径；你需要按 docs/DATASETS.md 准备好 data/thucnews 目录。
  data_dir: data/thucnews
  train_file: train.jsonl
  valid_file: valid.jsonl
  test_file: test.jsonl
